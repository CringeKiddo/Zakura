name: zakura
description: "Zakura - 3D Null Generator & Adevob Optical Vector Smear Engine"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # FFmpeg Kit Extended (Pinned for stable mobile x264 & x265 encoding)
  ffmpeg_kit_extended_flutter: 0.6.2

  # Media playback & system file picking
  video_player: ^2.8.2
  file_picker: ^8.0.0
  path_provider: ^2.1.2

  # Procedural audio & sound playback
  audioplayers: 6.1.0

  # Raw frame buffer encoding / decoding
  image: ^4.1.7

  # Native C++ Vulkan FFI bindings
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

ffmpeg_kit_extended_config:
  type: full
  gpl: true   # REQUIRED for libx264 and libx265 encoding

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/shaders/
